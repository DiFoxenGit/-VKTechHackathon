# После общих проверок один SHA независимо доставляется на оба стенда.
# Основной — 158.160.225.35, второй — auto-sell.site. SourceCraft не участвует.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Этап «Tests»: юнит-тесты, сборка фронтенда и интеграционный регресс
  # вёрстки идут параллельно (.github/workflows/tests.yml).
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  # Доставка на сервер: только push в main и только после зелёных проверок.
  deploy:
    name: Deploy / auto-sell (secondary)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'autosell'
    needs: [tests]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://auto-sell.site/presentations/
    concurrency:
      group: production
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          RUNTIME_PROFILE: ${{ secrets.DESIGNER_RUNTIME_PROFILE }}
        # Сервер сам забирает коммит из репозитория и пересобирает стек.
        run: |
          printf '%s' "$RUNTIME_PROFILE" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Check public health
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "https://auto-sell.site/presentations/health"

  deploy-primary:
    name: Deploy / 158.160.225.35 (primary)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRIMARY_DEPLOY_HOST != ''
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production-primary
      url: http://158.160.225.35/
    concurrency:
      group: production-primary
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - name: Configure restricted primary SSH key
        env:
          SSH_KEY: ${{ secrets.PRIMARY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRIMARY_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/primary_deploy_key
          chmod 600 ~/.ssh/primary_deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy the same tested commit to primary
        env:
          DEPLOY_HOST: ${{ vars.PRIMARY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.PRIMARY_DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/primary_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" </dev/null
      - name: Check primary public health
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors http://158.160.225.35/health
