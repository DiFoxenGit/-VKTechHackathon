# Проверки и деплой. Исходный репозиторий проекта — SourceCraft
# (lct-hackaton-2026/case-14-ai-presentation-designer-team-7), но у его организации
# кончилась квота CI, поэтому проверки и доставка живут здесь: GitHub-репозиторий
# публичный, и Actions на нём бесплатны. Ветка main зеркалится из SourceCraft, а
# сервер забирает коммит оттуда же — см. docs/deploy.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Этап «Tests»: юнит-тесты, сборка фронтенда и интеграционный регресс
  # вёрстки идут параллельно (.github/workflows/tests.yml).
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  # Доставка на сервер: только push в master и только после зелёных проверок.
  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}
    concurrency:
      group: production
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        # Сервер сам забирает коммит из репозитория и пересобирает стек.
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
              "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" </dev/null
      - name: Check public health
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "http://$DEPLOY_HOST/health"
