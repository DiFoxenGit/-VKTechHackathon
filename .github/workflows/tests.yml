# Все проверки перед деплоем. Вызывается из ci.yml как этап «Tests»,
# поэтому в интерфейсе Actions джобы видны как «Tests / pytest» и т.д.,
# а деплой начинается только когда зелёные все три.
name: Tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install LibreOffice for PDF and HTML export tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Unit and pipeline tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend (typecheck, build, image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Образ фронтенда сам запускает npm ci, tsc -b и vite build: одна сборка
      # проверяет и типы, и то, что соберётся на сервере.
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: designer-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  integration:
    name: Integration (regress, LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Регресс идёт в том же образе, что едет на сервер: те же LibreOffice,
      # шрифты и зависимости. Код берётся из рабочей копии, не из образа.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: designer-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Fixture templates
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/work" -w /work designer-backend:ci
          python tools/make_fixture_templates.py out/templates
      - name: Regression run
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/work" -w /work designer-backend:ci
          python tools/bench_templates.py out/templates
          --outline tools/regress_outline.json
          --source samples/source/материал-инициатива.md
          --render out/render --sheets out/sheets
          --json out/regress.json --markdown out/regress.md
      - name: Report to job summary
        if: always()
        run: |
          {
            echo "## Регресс вёрстки"
            echo
            echo "План: tools/regress_outline.json, 12 слайдов. Шаблоны: синтетические из tools/make_fixture_templates.py."
            echo "Контакт-листы всех колод — в артефакте **regress-sheets**."
            echo
            cat out/regress.md 2>/dev/null || echo "Отчёт не сформирован — смотрите лог шага Regression run."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload contact sheets and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-sheets
          path: |
            out/sheets/*.png
            out/regress.json
            out/regress.md
          retention-days: 14
          if-no-files-found: warn
