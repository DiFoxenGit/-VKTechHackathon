# Политики веток. Правило прежнее: в master попадают только предложения
# изменений, прямой push и force-push закрыты.
branch_protection:
  policies:
    - target: default_branch
      message: "Прямой push в master запрещён: создайте предложение изменений"
      rules:
        - prevent_force_push
        - prevent_non_pr_changes
        - prevent_deletion
