# Included in the existing auto-sell.site server block.
location = /presentations {
    return 301 /presentations/;
}

location = /presentations/health {
    proxy_pass http://127.0.0.1:8078/health;
    proxy_set_header Host $host;
}

location ^~ /presentations/api/ {
    proxy_pass http://127.0.0.1:8078/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /presentations;
    client_max_body_size 64m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;
    proxy_buffering off;
}

location /presentations/ {
    proxy_pass http://127.0.0.1:8079;
    proxy_set_header Host $host;
}
