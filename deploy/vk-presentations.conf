# Frontend and API share the public /presentations/ prefix.

location = /presentations {
    return 301 /presentations/;
}

location = /presentations/health {
    proxy_pass http://127.0.0.1:8077/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /presentations;
}

location = /presentations/docs {
    proxy_pass http://127.0.0.1:8077/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /presentations;
}

location = /presentations/docs/oauth2-redirect {
    proxy_pass http://127.0.0.1:8077/docs/oauth2-redirect;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /presentations;
}

location = /presentations/openapi.json {
    proxy_pass http://127.0.0.1:8077/openapi.json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /presentations;
}

location ^~ /presentations/api/ {
    proxy_pass http://127.0.0.1:8077/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /presentations;
    client_max_body_size 50m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;
    proxy_buffering off;
}

location /presentations/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /presentations/index.html;
    add_header Cache-Control "no-cache" always;
}
